version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Optional reverse proxy in front of the API, which runs on the host:
  #   docker compose --profile proxy up
  # deploy/nginx/community.conf passes GET /notifications/stream through
  # unbuffered (Server-Sent Events) and keeps it open; the API's heartbeat
  # keeps it from timing out. Set TRUST_PROXY_HOPS=1 for the API behind it.
  proxy:
    image: nginx:1.27-alpine
    container_name: community_proxy
    profiles: ["proxy"]
    restart: always
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/community.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  