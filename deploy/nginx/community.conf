# Reverse proxy in front of the API (docker compose --profile proxy up).
# The API runs on the host (npm run start:dev / start:prod) on API_PORT.

upstream community_api {
    server host.docker.internal:3000;
    keepalive 16;
}

server {
    listen 80;
    client_max_body_size 12m;

    # GET /notifications/stream: Server-Sent Events. Every event must leave at
    # once, and an idle stream must stay open:
    # - proxy_buffering off: no response buffering (the API also sends
    #   X-Accel-Buffering: no, which nginx honours on any location);
    # - gzip off: compression would hold events back until a block fills;
    # - HTTP/1.1 with an empty Connection header: a persistent upstream
    #   connection, not one closed after the first chunk;
    # - proxy_read_timeout 1h: well above the heartbeat
    #   (NOTIFICATION_STREAM_HEARTBEAT_SECONDS, 25 s by default), which keeps
    #   this and every other hop from timing the stream out.
    location = /notifications/stream {
        proxy_pass http://community_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://community_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
